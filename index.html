<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minesweeper | reincarnation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f3f4f6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        user-select: none;
      }

      .game-container {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      .grid-board {
        display: grid;
        gap: 2px;
        background-color: #9ca3af;
        border: 2px solid #9ca3af;
        margin: 1rem auto;
      }

      .cell {
        width: 30px;
        height: 30px;
        background-color: #e5e7eb;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        font-size: 14px;
        cursor: pointer;
        transition: background-color 0.1s;
      }

      .cell:hover:not(.revealed) {
        background-color: #d1d5db;
      }

      .cell.revealed {
        background-color: #ffffff;
        cursor: default;
      }

      .cell.mine {
        background-color: #fca5a5 !important;
      }

      .val-1 {
        color: #2563eb;
      }
      .val-2 {
        color: #16a34a;
      }
      .val-3 {
        color: #dc2626;
      }
      .val-4 {
        color: #9333ea;
      }
      .val-5 {
        color: #9f1239;
      }
      .val-6 {
        color: #0f766e;
      }
      .val-7 {
        color: #111827;
      }
      .val-8 {
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <div class="game-container">
      <h1 class="text-2xl font-bold mb-4 text-gray-800">Сапёр</h1>

      <div class="flex justify-between items-center mb-4 px-2">
        <div class="text-lg font-semibold text-red-600">
          Мин: <span id="mine-count">10</span>
        </div>
        <button
          id="reset-btn"
          class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 active:bg-blue-700 transition"
        >
          Перезапуск
        </button>
      </div>

      <div
        id="status-message"
        class="text-lg font-bold mb-4 h-6 text-gray-700"
      ></div>

      <div id="board" class="grid-board"></div>
    </div>

    <script>
      const BOARD_SIZE = 10;
      const NUM_MINES = 10;

      let board = [];
      let isGameOver = false;
      let revealedCellsCount = 0;

      const boardElement = document.getElementById("board");
      const statusElement = document.getElementById("status-message");
      const resetBtn = document.getElementById("reset-btn");
      const mineCountElement = document.getElementById("mine-count");

      boardElement.style.gridTemplateColumns = `repeat(${BOARD_SIZE}, 1fr)`;
      boardElement.style.gridTemplateRows = `repeat(${BOARD_SIZE}, 1fr)`;

      function initGame() {
        board = [];
        isGameOver = false;
        revealedCellsCount = 0;
        statusElement.innerText = "Игра началась!";
        statusElement.className = "text-lg font-bold mb-4 h-6 text-blue-600";
        boardElement.innerHTML = "";
        mineCountElement.innerText = NUM_MINES;

        for (let r = 0; r < BOARD_SIZE; r++) {
          let row = [];
          for (let c = 0; c < BOARD_SIZE; c++) {
            const cellData = {
              r: r,
              c: c,
              isMine: false,
              isRevealed: false,
              isFlagged: false,
              neighborMines: 0,
              element: document.createElement("div"),
            };

            cellData.element.classList.add("cell");
            cellData.element.dataset.r = r;
            cellData.element.dataset.c = c;
            cellData.element.addEventListener("click", () =>
              handleLeftClick(cellData),
            );
            cellData.element.addEventListener("contextmenu", (e) =>
              handleRightClick(e, cellData),
            );

            boardElement.appendChild(cellData.element);
            row.push(cellData);
          }
          board.push(row);
        }

        placeMines();
        calculateNeighbors();
      }

      function placeMines() {
        let minesPlaced = 0;
        while (minesPlaced < NUM_MINES) {
          const r = Math.floor(Math.random() * BOARD_SIZE);
          const c = Math.floor(Math.random() * BOARD_SIZE);

          if (!board[r][c].isMine) {
            board[r][c].isMine = true;
            minesPlaced++;
          }
        }
      }

      function calculateNeighbors() {
        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            if (board[r][c].isMine) continue;

            let count = 0;
            for (let i = -1; i <= 1; i++) {
              for (let j = -1; j <= 1; j++) {
                const newR = r + i;
                const newC = c + j;
                if (
                  newR >= 0 &&
                  newR < BOARD_SIZE &&
                  newC >= 0 &&
                  newC < BOARD_SIZE
                ) {
                  if (board[newR][newC].isMine) count++;
                }
              }
            }
            board[r][c].neighborMines = count;
          }
        }
      }

      function handleLeftClick(cell) {
        if (isGameOver || cell.isRevealed || cell.isFlagged) return;

        if (cell.isMine) {
          gameOver(false);
          return;
        }

        revealCell(cell.r, cell.c);
        checkWinCondition();
      }

      function handleRightClick(e, cell) {
        e.preventDefault();
        if (isGameOver || cell.isRevealed) return;

        cell.isFlagged = !cell.isFlagged;
        cell.element.innerText = cell.isFlagged ? "🚩" : "";

        let currentFlags = parseInt(mineCountElement.innerText);
        mineCountElement.innerText = cell.isFlagged
          ? currentFlags - 1
          : currentFlags + 1;
      }

      function revealCell(r, c) {
        if (r < 0 || r >= BOARD_SIZE || c < 0 || c >= BOARD_SIZE) return;

        const cell = board[r][c];
        if (cell.isRevealed || cell.isFlagged || cell.isMine) return;

        cell.isRevealed = true;
        cell.element.classList.add("revealed");
        revealedCellsCount++;

        if (cell.neighborMines > 0) {
          cell.element.innerText = cell.neighborMines;
          cell.element.classList.add(`val-${cell.neighborMines}`);
        } else {
          for (let i = -1; i <= 1; i++) {
            for (let j = -1; j <= 1; j++) {
              revealCell(r + i, c + j);
            }
          }
        }
      }

      function checkWinCondition() {
        const safeCells = BOARD_SIZE * BOARD_SIZE - NUM_MINES;
        if (revealedCellsCount === safeCells) {
          gameOver(true);
        }
      }

      function gameOver(isWin) {
        isGameOver = true;

        if (isWin) {
          statusElement.innerText = "🎉 Вы победили!";
          statusElement.className = "text-lg font-bold mb-4 h-6 text-green-600";
        } else {
          statusElement.innerText = "💥 Вы проиграли!";
          statusElement.className = "text-lg font-bold mb-4 h-6 text-red-600";
        }
        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            const cell = board[r][c];
            if (cell.isMine) {
              cell.element.classList.add("revealed", "mine");
              cell.element.innerText = "💣";
            }
          }
        }
      }

      resetBtn.addEventListener("click", initGame);
      window.onload = initGame;
    </script>
  </body>
</html>
